services:
  mysql:
    image: mysql:8.4
    container_name: college-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college
      MYSQL_USER: college
      MYSQL_PASSWORD: college

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucollege", "-pcollege"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:latest
    container_name: college-flyway

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - migrate
      - -url=jdbc:mysql://mysql:3306/college
      - -user=college
      - -password=college
      - -locations=filesystem:/flyway/sql

    volumes:
      - ./migrations:/flyway/sql:ro
