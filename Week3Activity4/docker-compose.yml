services:
  mysql:
    image: mysql:8.4
    container_name: my-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:latest
    container_name: my-flyway

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - migrate
      - -url=jdbc:mysql://mysql:3306/app
      - -user=app
      - -password=app
      - -locations=filesystem:/flyway/sql

    volumes:
      - ./migrations:/flyway/sql:ro